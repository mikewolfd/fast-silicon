[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-embeddinggemma-2"
version = "0.1.0"
description = "Hardware-limit Apple Silicon (M4 Pro GPU + 16-core ANE + CPU SME) EmbeddingGemma-2 engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fast-shared>=0.1.0",
    "mlx>=0.32.4",
    "numpy>=1.26.0",
    "tokenizers>=0.20.0",
    "pyarrow>=18.0.0",
    "huggingface-hub>=0.25.0",
]

[tool.uv.sources]
fast-shared = { path = "../fast-shared", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
ane-build = [
    "coremltools>=8.0",
]
vision = [
    "pillow>=10.0.0",
]

[project.scripts]
embeddinggemma-2 = "fast_embeddinggemma_2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
