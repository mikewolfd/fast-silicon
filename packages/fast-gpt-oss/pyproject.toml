[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-gpt-oss"
version = "0.1.0"
description = "Hardware-limit Apple Silicon (M4/M5 Metal 4 MPP + MXFP4 + Hydragen v2 + llguidance + Harmony) inference engine for openai/gpt-oss-20b"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fast-shared>=0.1.0",
    "mlx>=0.32.4",
    "numpy>=1.26.0",
    "tokenizers>=0.20.0",
    "pyarrow>=18.0.0",
    "huggingface-hub>=0.25.0",
    "llguidance>=1.0.0",
]

[tool.uv.sources]
fast-shared = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
gpt-oss = "fast_gpt_oss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
