[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-bge-small"
version = "0.1.0"
description = "Hardware-limit Apple Silicon (M4 Pro GPU + 16-core ANE) BGE-small-en-v1.5 embedding engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fast-shared>=0.1.0",
    "mlx>=0.30.0",
    "numpy>=1.26.0",
    "tokenizers>=0.20.0",
    "pyarrow>=18.0.0",
    "huggingface-hub>=0.25.0",
]

[tool.uv.sources]
fast-shared = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
ane-build = [
    "coremltools>=8.0",
]

[project.scripts]
bge-small = "fast_bge_small.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
