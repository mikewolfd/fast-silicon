[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-qwen3"
version = "0.1.0"
description = "Hardware-limit Apple Silicon (M4/M5 Metal 4 + Hybrid GatedDeltaNet + Spec-Bucketed OptiQ + MTP + llguidance) inference engine for Qwen3.5 & Qwen3.6"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fast-shared>=0.1.0",
    "mlx>=0.32.4",
    "numpy>=1.26.0",
    "tokenizers>=0.20.0",
    "pyarrow>=18.0.0",
    "huggingface-hub>=0.25.0",
    "llguidance>=1.0.0",
]

[tool.uv.sources]
fast-shared = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
fast-qwen3 = "fast_qwen3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
