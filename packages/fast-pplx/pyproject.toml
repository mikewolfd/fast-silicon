[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-pplx"
version = "0.1.0"
description = "Hardware-limit Apple Silicon (M4 Pro Metal GPU + 16-core ANE) pplx-embed-v2-context-0.6b contextual embedding engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fast-shared>=0.1.0",
    "mlx>=0.32.4",
    "numpy>=1.26.0",
    "tokenizers>=0.20.0",
    "pyarrow>=18.0.0",
    "huggingface-hub>=0.25.0",
]

[tool.uv.sources]
fast-shared = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
ane-build = [
    "coremltools>=8.0",
]
vision = [
    "pillow>=10.0",
]

[project.scripts]
fast-pplx = "fast_pplx.cli:main"
pplx-embed = "fast_pplx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "gpu_ane: requires real model weights and Apple Silicon GPU/ANE hardware (serialized via lock)",
]
