<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="920" height="310" role="img" aria-label="fast-silicon batch speedup versus stock MLX on Base M5">
  <rect width="920" height="310" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">fast-silicon vs. Stock MLX on Base M5 (Batch Throughput Multiplier)</text>
  <text x="24" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">Measured on Base M5 (24 GB, macOS 27.2.1); dashed line marks 1.0x stock MLX baseline.</text>

  <!-- 1.0x reference line at x = 265 + 24 = 289 (scale: 24px per 1.0x) -->
  <line x1="289" y1="74" x2="289" y2="274" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="289" y="294" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b949e">1.0x Stock MLX</text>

  <!-- Row 1: BGE-small (12.17x -> 292px) -->
  <text x="24" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e6edf3">BGE-small retrieval</text>
  <rect x="265" y="84" width="292" height="22" rx="4" fill="#2f81f7"/>
  <text x="567" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">12.2x MLX (218.9k tok/s, 11.0s vs 133.8s)</text>

  <!-- Row 2: Gemma 4 E2B (5.18x -> 124px) -->
  <text x="24" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e6edf3">Gemma 4 E2B JSON</text>
  <rect x="265" y="118" width="124" height="22" rx="4" fill="#2f81f7"/>
  <text x="399" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">5.2x mlx-vlm (10.5 @ B=128 vs 2.0 @ B=64 valid docs/s)</text>

  <!-- Row 3: PPLX-0.6B (4.41x -> 106px) -->
  <text x="24" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e6edf3">PPLX-0.6B contextual</text>
  <rect x="265" y="152" width="106" height="22" rx="4" fill="#2f81f7"/>
  <text x="381" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">4.4x MLX (136.5s vs 601.5s, 325 queries)</text>

  <!-- Row 4: EmbeddingGemma-2 (4.33x -> 104px) -->
  <text x="24" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e6edf3">EmbeddingGemma-2 2K</text>
  <rect x="265" y="186" width="104" height="22" rx="4" fill="#2f81f7"/>
  <text x="379" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">4.3x MLX (51.5k tok/s, 6.2x CoreAI, 57.1s vs 246.9s)</text>

  <!-- Row 5: OvisOCR2 (2.05x -> 49px) -->
  <text x="24" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e6edf3">OvisOCR2 (olmOCR-4)</text>
  <rect x="265" y="220" width="49" height="22" rx="4" fill="#3fb950"/>
  <text x="324" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">2.05x mlx-vlm (4-page forced VLM, 233 tok/s, 5.0 GB)</text>

  <!-- Row 6: Laya-421M (1.96x -> 47px) -->
  <text x="24" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e6edf3">Laya-421M decisions</text>
  <rect x="265" y="254" width="47" height="22" rx="4" fill="#3fb950"/>
  <text x="322" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">2.0x MLX (37.9s vs 73.9s, 25x CoreAI)</text>
</svg>
