[project]
name = "fast-silicon"
version = "0.1.0"
description = "Hardware-limit Apple Silicon (M4 / M5+ Metal 4 MPP + 16-core ANE + CPU SME) ML inference and embedding workspace."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.32.4",
    "fast-shared",
    "fast-bge-small",
    "fast-embeddinggemma-2",
    "fast-gemma4",
    "fast-gpt-oss",
    "fast-decision-models",
    "fast-pplx",
    "fast-qwen3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
build = [
    "coremltools>=8.0",
    "safetensors",
    "torch>=2.4",
]
# Structured extraction, JSON Schema validation, Parquet I/O, and postal-address parsing deps
# so a single workspace `.venv` can run end-to-end extraction pipelines without split environments.
extract = [
    "pyarrow>=15",
    "jsonschema>=4.18,<5",
    "usaddress==0.5.14",
    "pycountry==26.2.16",
    "msgspec-schemaorg==0.2.1",
    "msgspec==0.21.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
fast-shared = { workspace = true }
fast-bge-small = { workspace = true }
fast-embeddinggemma-2 = { workspace = true }
fast-gemma4 = { workspace = true }
fast-gpt-oss = { workspace = true }
fast-decision-models = { workspace = true }
fast-pplx = { workspace = true }
fast-qwen3 = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "gpu_ane: requires real model weights and Apple Silicon GPU/ANE hardware (serialized via lock)",
]
